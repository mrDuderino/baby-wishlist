# Baby Wishlist — Supabase configuration
# https://supabase.com/docs/guides/local-development/cli/config

project_id = "baby-wishlist"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = false

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
# Global: no public self-registration (admins are created manually)
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# Must be true — otherwise email login is fully disabled (GOTRUE_EXTERNAL_EMAIL_ENABLED=false)
# Invite-only: keep [auth].enable_signup=false, [auth.email].enable_signup=true
enable_signup = true
enable_confirmations = false

[analytics]
enabled = false
